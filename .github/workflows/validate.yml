name: validate

# This repo had no PR-triggered job at all: two workflows, both publishing a
# Docker image on push to main, and nothing that ran the 61 tests already in
# src/**/__tests__. So a PR could not be wrong in any way CI would notice, and
# the first thing to learn of a mistake was a published image.
#
# It is also the repo whose image path pointed at the old org for six weeks after
# it moved — failing every run, on an account nobody was reading. A check that
# runs only after merge tells you what you broke, not what you are about to.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install (locked)
        run: npm ci

      # Types first: it is the cheapest failure and the one most likely to be
      # what a reviewer would otherwise catch by eye.
      - name: typecheck
        run: npm run lint

      - name: test
        run: npm test

      # The Dockerfile is what actually ships. Building it here means a broken
      # image is a failed PR rather than a failed publish after merge.
      - name: docker build (no push)
        run: docker build -t ccip-router:pr .
