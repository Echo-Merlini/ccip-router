name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          # No GHA layer cache. `cache-to: type=gha,mode=max` was serving stale layers, so `:latest`
          # shipped a pre-TSEI build even when the run "succeeded" on a fresh commit (it downgraded a
          # mesh node from 0.7.0 to a pre-TSEI 0.6.5 on pull). A conformance/attestation node must be
          # built from the checked-out source every time — correctness over a few minutes of build.
          no-cache: true
          pull: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ccip-router:latest
            ghcr.io/${{ github.repository_owner }}/ccip-router:${{ steps.pkg.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ccip-router:sha-${{ steps.sha.outputs.short }}

      - name: Trigger Railway redeploy
        if: github.ref_type == 'branch'
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
        run: '[ -n "$RAILWAY_DEPLOY_HOOK" ] && curl -sX POST "$RAILWAY_DEPLOY_HOOK" || true'
